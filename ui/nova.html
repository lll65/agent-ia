<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA</title>
<style>
  :root{ --bg:#060610; --glass:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.12);
         --neon:#7c5cff; --neon2:#22d3ee; --pink:#ec4899; --txt:#e9e9f5; --dim:#9aa0b5; }
  *{ box-sizing:border-box; margin:0; padding:0; } html,body{ height:100%; }
  body{ font-family:'Inter',system-ui,sans-serif; color:var(--txt); background:var(--bg); overflow:hidden; }
  /* Aurora d'ouverture — magnifique au démarrage, se tamise une fois la conversation lancée */
  #aurora{ position:fixed; inset:0; z-index:0; overflow:hidden; filter:blur(70px); transition:opacity 1.3s ease, filter 1.3s ease; }
  #aurora .blob{ position:absolute; border-radius:50%; opacity:.6; mix-blend-mode:screen; will-change:transform; }
  #aurora .b1{ width:60vw; height:60vw; left:-12vw; top:-16vh; background:radial-gradient(circle,#7c5cff,transparent 68%); animation:float1 22s ease-in-out infinite; }
  #aurora .b2{ width:52vw; height:52vw; right:-10vw; top:2vh; background:radial-gradient(circle,#22d3ee,transparent 68%); animation:float2 26s ease-in-out infinite; }
  #aurora .b3{ width:46vw; height:46vw; left:22vw; bottom:-18vh; background:radial-gradient(circle,#ec4899,transparent 70%); animation:float3 30s ease-in-out infinite; }
  @keyframes float1{ 0%,100%{ transform:translate(0,0) scale(1) } 50%{ transform:translate(7vw,6vh) scale(1.15) } }
  @keyframes float2{ 0%,100%{ transform:translate(0,0) scale(1) } 50%{ transform:translate(-6vw,5vh) scale(.9) } }
  @keyframes float3{ 0%,100%{ transform:translate(0,0) scale(1) } 50%{ transform:translate(5vw,-6vh) scale(1.1) } }
  body.chatting #aurora{ opacity:.22; filter:blur(90px); }
  #particles{ position:fixed; inset:0; z-index:0; }
  .app{ position:relative; z-index:2; height:100dvh; display:flex; flex-direction:column; max-width:860px; margin:0 auto; padding:14px; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:4px 4px 10px; }
  .logo{ font-weight:800; font-size:26px; letter-spacing:.32em; background:linear-gradient(90deg,var(--neon),var(--neon2));
         -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 0 26px rgba(124,92,255,.45); }
  .logo small{ display:block; letter-spacing:.18em; font-size:10px; color:var(--dim); text-shadow:none; font-weight:600; }
  .tools{ display:flex; gap:8px; }
  .ic{ background:var(--glass); border:1px solid var(--stroke); color:var(--txt); width:40px; height:40px; border-radius:12px; cursor:pointer; font-size:16px; transition:.2s; }
  .ic:hover{ border-color:var(--neon); box-shadow:0 0 18px rgba(124,92,255,.4); }
  .ic.on{ border-color:var(--neon2); box-shadow:0 0 16px rgba(34,211,238,.5); }

  .chat{ flex:1; overflow-y:auto; padding:8px 4px; display:flex; flex-direction:column; gap:14px; scrollbar-width:thin; scrollbar-color:var(--neon) transparent; }
  .row{ display:flex; animation:pop .35s cubic-bezier(.2,.9,.3,1.2); } .row.me{ justify-content:flex-end; }
  @keyframes pop{ from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
  .col{ display:flex; flex-direction:column; max-width:82%; gap:6px; }
  .bubble{ max-width:100%; padding:13px 16px; border-radius:18px; line-height:1.5; font-size:15px; border:1px solid var(--stroke); backdrop-filter:blur(12px); white-space:pre-wrap; word-wrap:break-word; }
  .me .bubble{ max-width:82%; background:linear-gradient(135deg,var(--neon),#5b46d6); border:none; border-radius:18px 18px 5px 18px; box-shadow:0 8px 26px rgba(124,92,255,.35); }
  .ai .bubble{ background:var(--glass); border-radius:18px 18px 18px 5px; }
  /* Menu déroulant : raisonnement de Nova */
  details.reason{ font-size:12.5px; }
  details.reason summary{ cursor:pointer; color:var(--dim); list-style:none; padding:3px 4px; user-select:none; display:inline-flex; align-items:center; gap:6px; border-radius:8px; transition:.2s; }
  details.reason summary::-webkit-details-marker{ display:none; }
  details.reason summary::before{ content:"⌄"; transition:transform .25s; display:inline-block; }
  details.reason[open] summary::before{ transform:rotate(180deg); }
  details.reason summary:hover,details.reason[open] summary{ color:var(--neon2); }
  .rsteps{ border-left:2px solid var(--stroke); margin:2px 0 2px 8px; padding:6px 0 4px 12px; display:flex; flex-direction:column; gap:9px; }
  .rstep{ display:flex; gap:9px; align-items:flex-start; animation:pop .3s; }
  .rstep .ri{ font-size:14px; flex:0 0 auto; filter:drop-shadow(0 0 6px rgba(34,211,238,.5)); }
  .rstep .rl{ color:var(--txt); font-weight:600; } .rstep .rd{ color:var(--dim); font-size:11.5px; word-break:break-word; }
  .bubble pre{ background:#05050c; border:1px solid var(--stroke); border-radius:10px; padding:11px; overflow-x:auto; margin:8px 0; font-size:13px; font-family:ui-monospace,monospace; }
  .bubble a{ color:var(--neon2); }
  .think{ display:inline-flex; align-items:center; gap:8px; color:var(--dim); font-size:14px; animation:fadeSwap .5s ease; }
  @keyframes fadeSwap{ from{opacity:0; transform:translateY(7px); filter:blur(4px)} to{opacity:1; transform:none; filter:blur(0)} }
  .think .dot{ width:7px; height:7px; border-radius:50%; background:var(--neon2); box-shadow:0 0 10px var(--neon2); animation:blink 1s infinite; }
  .cur{ animation:blink 1s step-end infinite; color:var(--neon2); }
  @keyframes blink{ 50%{ opacity:.2 } }
  .avatar{ width:30px; height:30px; border-radius:9px; margin:2px 9px 0 0; flex:0 0 auto; background:linear-gradient(135deg,var(--neon),var(--neon2)); display:grid; place-items:center; font-size:15px; box-shadow:0 0 16px rgba(34,211,238,.4); }

  /* Graphe de raisonnement — plein écran, en arrière-plan */
  #graphWrap{ display:none; position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity .7s ease; }
  #graphWrap.show{ display:block; opacity:1; }
  #graph{ width:100%; height:100%; }
  #graphWrap .cap{ position:fixed; top:64px; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:.34em; color:var(--dim); opacity:.55; }

  .composer{ display:flex; gap:10px; padding-top:8px; }
  .composer textarea{ flex:1; resize:none; background:var(--glass); border:1px solid var(--stroke); color:var(--txt); border-radius:16px; padding:14px 16px; font-size:15px; font-family:inherit; max-height:120px; outline:none; transition:.2s; }
  .composer textarea:focus{ border-color:var(--neon); box-shadow:0 0 22px rgba(124,92,255,.35); }
  .send,.micbtn{ width:54px; border:none; border-radius:16px; cursor:pointer; font-size:19px; color:#fff; transition:.15s; }
  .send{ background:linear-gradient(135deg,var(--neon),var(--neon2)); box-shadow:0 6px 22px rgba(124,92,255,.45); }
  .micbtn{ background:var(--glass); border:1px solid var(--stroke); } .micbtn.rec{ background:var(--pink); animation:pulse .8s infinite; }
  @keyframes pulse{ 50%{ box-shadow:0 0 0 8px rgba(236,72,153,.25) } }
  .send:active{ transform:scale(.92); } .send:disabled{ opacity:.5; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; padding:2px 0 6px; }
  .chip{ font-size:12.5px; color:var(--dim); background:var(--glass); border:1px solid var(--stroke); border-radius:999px; padding:7px 13px; cursor:pointer; transition:.2s; }
  .chip:hover{ color:#fff; border-color:var(--neon); }
  .hint{ text-align:center; color:var(--dim); font-size:13px; margin:auto 0; opacity:.8; }
  .modal{ position:fixed; inset:0; z-index:9; background:rgba(0,0,0,.6); display:none; place-items:center; padding:20px; } .modal.show{ display:grid; }
  .card{ background:#0d0d1a; border:1px solid var(--stroke); border-radius:18px; padding:22px; max-width:420px; width:100%; }
  .card h3{ margin-bottom:6px; } .card p{ color:var(--dim); font-size:13px; margin-bottom:14px; }
  .card input{ width:100%; background:#05050c; border:1px solid var(--stroke); color:var(--txt); border-radius:11px; padding:12px; font-size:14px; outline:none; }
  .card button{ width:100%; margin-top:12px; padding:12px; border:none; border-radius:11px; color:#fff; cursor:pointer; background:linear-gradient(135deg,var(--neon),var(--neon2)); font-weight:700; }

  /* ═══ Touches "du futur" & fluidité ═══ */
  .app{ padding-bottom:max(14px,env(safe-area-inset-bottom)); padding-top:max(14px,env(safe-area-inset-top)); }
  /* Logo qui respire, plus intense quand Nova réfléchit */
  .logo{ animation:breathe 5s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ filter:drop-shadow(0 0 14px rgba(124,92,255,.35)) } 50%{ filter:drop-shadow(0 0 26px rgba(34,211,238,.55)) } }
  body.thinking .logo{ animation-duration:1.6s; }
  /* Avatar : anneau lumineux qui tourne pendant la réflexion */
  .avatar{ position:relative; }
  body.thinking .ai:last-child .avatar::after{ content:""; position:absolute; inset:-3px; border-radius:11px; border:2px solid transparent; border-top-color:var(--neon2); border-right-color:var(--neon); animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  /* Bulles : apparition avec léger flou (plus "premium") */
  @keyframes pop{ from{opacity:0; transform:translateY(14px); filter:blur(6px)} to{opacity:1; transform:none; filter:blur(0)} }
  /* Composer : halo animé quand Nova réfléchit */
  body.thinking .composer textarea{ border-color:var(--neon2); box-shadow:0 0 26px rgba(34,211,238,.3); }
  /* Bouton envoyer : dégradé qui glisse + halo au survol */
  .send{ background-size:180% 180%; animation:slideGrad 6s ease infinite; }
  @keyframes slideGrad{ 0%,100%{ background-position:0% 50% } 50%{ background-position:100% 50% } }
  .send:hover{ box-shadow:0 6px 30px rgba(34,211,238,.6); transform:translateY(-1px); }
  .ic{ transition:transform .2s, box-shadow .2s, border-color .2s; } .ic:active{ transform:scale(.9); }
  /* Chips : balayage lumineux au survol */
  .chip{ position:relative; overflow:hidden; }
  .chip::before{ content:""; position:absolute; top:0; left:-120%; width:60%; height:100%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent); transition:left .5s; }
  .chip:hover::before{ left:140%; }
  .chip:hover{ transform:translateY(-1px); box-shadow:0 4px 16px rgba(124,92,255,.25); }
  /* Scrollbar fine et néon (webkit) */
  .chat::-webkit-scrollbar{ width:6px; } .chat::-webkit-scrollbar-thumb{ background:linear-gradient(var(--neon),var(--neon2)); border-radius:6px; }
  /* Voile de scintillement très subtil en haut de l'écran */
  .app::before{ content:""; position:fixed; top:0; left:0; right:0; height:120px; pointer-events:none; z-index:3;
    background:radial-gradient(120% 100% at 50% 0%, rgba(124,92,255,.12), transparent 70%); }
  /* Barre de tokens */
  .usage{ display:flex; align-items:center; gap:7px; font-size:10.5px; color:var(--dim); margin-right:4px; }
  .ubar{ width:64px; height:6px; border-radius:6px; background:var(--glass); border:1px solid var(--stroke); overflow:hidden; }
  .ubar i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--neon),var(--neon2)); box-shadow:0 0 10px var(--neon2); transition:width .7s ease; }
  .usage.warn .ubar i{ background:linear-gradient(90deg,#f59e0b,#ef4444); }
  .usage b{ color:var(--txt); font-weight:600; }
  /* Quand Nova réfléchit : bulles plus transparentes → on VOIT le schéma derrière */
  body.thinking .ai .bubble{ background:rgba(255,255,255,.03); border-color:rgba(124,92,255,.25); }
  @media (max-width:560px){ .logo{ font-size:22px } .bubble{ font-size:14.5px } .chips{ gap:6px } .usage{ display:none } }
  @media (prefers-reduced-motion:reduce){ #graph{ opacity:.9 } .logo,.send,.blob{ animation:none!important } }
</style>
</head>
<body>
  <div id="aurora"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
  <canvas id="particles"></canvas>
  <div id="graphWrap"><span class="cap">RAISONNEMENT EN DIRECT</span><canvas id="graph"></canvas></div>
  <div class="app">
    <header>
      <div class="logo">NOVA<small>ASSISTANT · DU FUTUR</small></div>
      <div class="tools">
        <div class="usage" id="usage" title="Tokens utilisés aujourd'hui">
          <span>🪙</span><div class="ubar"><i id="ufill"></i></div><span id="utext">…</span>
        </div>
        <button class="ic on" id="ttsBtn" onclick="toggleTTS()" title="Voix de Nova">🔊</button>
        <button class="ic" onclick="openCfg()" title="Réglages">⚙️</button>
      </div>
    </header>

    <div class="chips">
      <span class="chip" onclick="quick(this)">Mon agenda cette semaine ?</span>
      <span class="chip" onclick="quick(this)">Résume l'actu tech du jour</span>
      <span class="chip" onclick="quick(this)">Planifie ma journée</span>
    </div>

    <div class="chat" id="chat"><div class="hint" id="hint">✨ Bonjour, je suis Nova. Parle-moi ou écris.</div></div>

    <div class="composer">
      <button class="micbtn" id="mic" onclick="toggleMic()" title="Parler">🎤</button>
      <textarea id="in" rows="1" placeholder="Parle à Nova…" onkeydown="keydown(event)" oninput="grow(this)"></textarea>
      <button class="send" id="send" onclick="ask()">➤</button>
    </div>
  </div>

  <div class="modal" id="cfg"><div class="card">
    <h3>🔑 Connexion à Nova</h3><p>Colle ta clé (valeur de <b>AGENT_API_KEY</b> sur Render). Elle reste sur ton appareil.</p>
    <input id="key" type="password" placeholder="Ta clé API…"><button onclick="saveCfg()">Enregistrer</button>
  </div></div>

<script>
const ORIGIN = location.origin;
let KEY = localStorage.getItem("nova_key")||"", TTS = localStorage.getItem("nova_tts")!=="0";
const chat=document.getElementById("chat"), hint=document.getElementById("hint");
document.getElementById("ttsBtn").classList.toggle("on", TTS);
if(!KEY) openCfg();
function openCfg(){ document.getElementById("key").value=KEY; document.getElementById("cfg").classList.add("show"); }
function saveCfg(){ KEY=document.getElementById("key").value.trim(); localStorage.setItem("nova_key",KEY); document.getElementById("cfg").classList.remove("show"); }
function toggleTTS(){ TTS=!TTS; localStorage.setItem("nova_tts",TTS?"1":"0"); document.getElementById("ttsBtn").classList.toggle("on",TTS); if(!TTS) speechSynthesis.cancel(); }
function grow(t){ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,120)+"px"; }
function keydown(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); ask(); } }
function quick(el){ document.getElementById("in").value=el.textContent; ask(); }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){ return esc(s).replace(/```([\s\S]*?)```/g,(m,c)=>"<pre>"+c.trim()+"</pre>").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>').replace(/\n/g,"<br>"); }
function addRow(who,html){ if(hint)hint.remove(); const r=document.createElement("div"); r.className="row "+(who==="me"?"me":"ai");
  r.innerHTML = who==="ai"
    ? '<div class="avatar">🧠</div><div class="col"><div class="bubble">'+html+'</div></div>'
    : '<div class="bubble">'+html+'</div>';
  chat.appendChild(r); chat.scrollTop=chat.scrollHeight; return r.querySelector(".bubble"); }
/* Ajoute le menu déroulant "Raisonnement" sous une bulle IA à partir de la trace collectée */
function attachReason(bubble,trace){ if(!trace||!trace.length) return; const col=bubble.parentElement;
  const steps=trace.map(s=>'<div class="rstep"><span class="ri">'+s.icon+'</span><span><span class="rl">'+esc(s.label)+'</span>'+(s.detail?'<br><span class="rd">'+esc(s.detail)+'</span>':'')+'</span></div>').join("");
  const d=document.createElement("details"); d.className="reason";
  d.innerHTML='<summary>Raisonnement · '+trace.length+' étape'+(trace.length>1?'s':'')+'</summary><div class="rsteps">'+steps+'</div>';
  col.appendChild(d); chat.scrollTop=chat.scrollHeight; }

/* ═══ PARTICULES réactives ═══ */
const pc=document.getElementById("particles"), px=pc.getContext("2d"); let PW,PH,parts=[],thinking=false;
function resize(){ PW=pc.width=innerWidth; PH=pc.height=innerHeight; }
addEventListener("resize",resize); resize();
for(let i=0;i<70;i++) parts.push({x:Math.random()*PW,y:Math.random()*PH,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+.5});
function loopP(){ px.clearRect(0,0,PW,PH); const sp=thinking?2.6:1, gl=thinking?.9:.4;
  for(const p of parts){ p.x+=p.vx*sp; p.y+=p.vy*sp; if(p.x<0||p.x>PW)p.vx*=-1; if(p.y<0||p.y>PH)p.vy*=-1;
    px.beginPath(); px.arc(p.x,p.y,p.r*(thinking?1.6:1),0,7); px.fillStyle=`rgba(124,92,255,${gl})`; px.shadowBlur=thinking?14:6; px.shadowColor="#7c5cff"; px.fill(); }
  px.shadowBlur=0; requestAnimationFrame(loopP); } loopP();

/* ═══ GRAPHE de raisonnement — HUD 3D façon "automation" ═══ */
const gw=document.getElementById("graphWrap"), gc=document.getElementById("graph"), gx=gc.getContext("2d");
let nodes=[], gAnim=null, GW=innerWidth, GH=innerHeight, GCX=GW/2, GCY=GH*.42, GT=0, RAD=220;
function gResize(){ const dpr=Math.min(devicePixelRatio||1,2); GW=innerWidth; GH=innerHeight;
  gc.width=GW*dpr; gc.height=GH*dpr; gc.style.width=GW+"px"; gc.style.height=GH+"px";
  gx.setTransform(dpr,0,0,dpr,0,0); GCX=GW/2; GCY=GH*.42; RAD=Math.min(GW,GH)*.30; }
function graphStart(){ gw.classList.add("show"); gResize(); GT=0;
  nodes=[{core:1,a:0,r:1,tr:1,label:"NOVA",icon:"🧠",t:0}]; if(!gAnim) drawGraph(); }
function graphAdd(icon,label){ const n=nodes.length-1; nodes.push({a:n*2.399, r:0, tr:1, label, icon, t:0}); }
/* arcs de cercle segmentés (look HUD/tech) */
function ring(cx,cy,rad,seg,off,col,w){ gx.strokeStyle=col; gx.lineWidth=w;
  for(let k=0;k<seg;k++){ const a0=off+k*(6.283/seg), a1=a0+(6.283/seg)*.6;
    gx.beginPath(); gx.arc(cx,cy,rad,a0,a1); gx.stroke(); } }
/* position orbitale (ellipse = fausse 3D) + profondeur pour le rendu */
function nodePos(nd){ const ang=nd.a+GT*.15, ex=Math.cos(ang)*RAD*nd.r, ey=Math.sin(ang)*RAD*.60*nd.r;
  return {x:GCX+ex, y:GCY+ey, depth:(Math.sin(ang)+1)/2}; }
function drawGraph(){ gx.clearRect(0,0,GW,GH); const core=nodes[0]; if(!core){gAnim=null;return;}
  GT+=0.02; core.t++;
  // Anneaux concentriques (contra-rotatifs) → ambiance cockpit/automation
  for(let i=0;i<4;i++){ const rr=RAD*(0.5+i*0.42), dir=i%2?-1:1;
    ring(GCX,GCY,rr, 3+i, GT*.2*dir, "rgba(124,92,255,"+(0.13-i*0.02)+")", 1.3);
    ring(GCX,GCY,rr*0.9, 6+i*2, -GT*.16*dir, "rgba(34,211,238,"+(0.10-i*0.015)+")", 1); }
  // Noeuds triés par profondeur (les plus proches devant = 3D)
  const drawn=[];
  for(let i=1;i<nodes.length;i++){ const nd=nodes[i]; nd.r+=(nd.tr-nd.r)*.07; nd.t++; const p=nodePos(nd); p.nd=nd; drawn.push(p); }
  drawn.sort((a,b)=>a.depth-b.depth);
  for(const p of drawn){ const g=gx.createLinearGradient(GCX,GCY,p.x,p.y);
    g.addColorStop(0,"rgba(124,92,255,.55)"); g.addColorStop(1,"rgba(34,211,238,.12)");
    gx.beginPath(); gx.moveTo(GCX,GCY); gx.lineTo(p.x,p.y); gx.strokeStyle=g; gx.lineWidth=1.4; gx.stroke(); }
  for(const p of drawn){ const nd=p.nd, sc=(0.6+p.depth*0.7), R=22*sc*nd.r, al=(0.35+p.depth*0.65);
    ring(p.x,p.y,R+6,4,GT*.6,"rgba(34,211,238,"+(0.3*al)+")",1);
    gx.beginPath(); gx.arc(p.x,p.y,R,0,7); gx.fillStyle="rgba(10,14,30,"+(0.55*al)+")"; gx.strokeStyle="rgba(34,211,238,"+(0.9*al)+")";
    gx.lineWidth=1.7; gx.shadowBlur=18*al; gx.shadowColor="#22d3ee"; gx.fill(); gx.stroke(); gx.shadowBlur=0;
    gx.globalAlpha=al; gx.textAlign="center"; gx.textBaseline="middle"; gx.fillStyle="#fff";
    gx.font=Math.round(17*sc)+"px sans-serif"; gx.fillText(nd.icon,p.x,p.y);
    gx.textBaseline="alphabetic"; gx.fillStyle="rgba(215,220,240,"+al+")"; gx.font=Math.round(10.5*sc)+"px sans-serif";
    gx.fillText(nd.label.slice(0,16),p.x,p.y+R+13); gx.globalAlpha=1; }
  // Coeur HUD lumineux
  const pulse=30+Math.sin(core.t*.07)*4;
  ring(GCX,GCY,pulse+17,3,GT*.4,"rgba(124,92,255,.55)",2);
  ring(GCX,GCY,pulse+9,6,-GT*.5,"rgba(34,211,238,.45)",1.4);
  const cg=gx.createRadialGradient(GCX,GCY,2,GCX,GCY,pulse);
  cg.addColorStop(0,"rgba(170,140,255,.95)"); cg.addColorStop(1,"rgba(124,92,255,.55)");
  gx.beginPath(); gx.arc(GCX,GCY,pulse,0,7); gx.fillStyle=cg; gx.shadowBlur=42; gx.shadowColor="#7c5cff"; gx.fill(); gx.shadowBlur=0;
  gx.textAlign="center"; gx.textBaseline="middle"; gx.fillStyle="#fff"; gx.font="24px sans-serif"; gx.fillText("🧠",GCX,GCY);
  gx.textBaseline="alphabetic"; gx.fillStyle="rgba(233,233,245,.9)"; gx.font="700 11px sans-serif"; gx.fillText("NOVA",GCX,GCY+pulse+18);
  gAnim=requestAnimationFrame(drawGraph); }
function graphEnd(){ setTimeout(()=>{ gw.classList.remove("show"); cancelAnimationFrame(gAnim); gAnim=null; },3200); }
const ICON={search:"🔍",web:"🔍",mail:"📧",gmail:"📧",calendar:"📅",agenda:"📅",connected_app:"🔌",thought:"💭",obs:"👁️",code:"💻"};
function iconFor(kind,tool){ const k=(tool||"").toLowerCase(); for(const key in ICON) if(k.includes(key)) return ICON[key]; return ICON[kind]||"⚙️"; }

/* ═══ STREAMING (SSE) ═══ */
function stepLabel(d){ const t=(d.tool||"").toLowerCase();
  if(d.kind==="thought") return "Nova réfléchit…";
  if(t.includes("search")||t.includes("web")) return "Recherche sur le web…";
  if(t.includes("calendar")||t.includes("agenda")||t.includes("connected")) return "Consultation de ton agenda / tes apps…";
  if(t.includes("mail")||t.includes("gmail")) return "Lecture de tes mails…";
  if(d.kind==="obs") return "Analyse des résultats…";
  return (d.tool? d.tool : "Traitement")+"…"; }
function thinkHTML(txt,icon){ return '<span class="think"><span class="dot"></span>'+(icon?icon+" ":"")+esc(txt)+'<span class="cur">▍</span></span>'; }
const THINK_PHRASES=["Nova réfléchit…","J'analyse ta demande…","Je choisis les bons outils…","Je rassemble les informations…","Je réfléchis à la meilleure réponse…","Je structure tout ça…"];
function ask(){
  const inp=document.getElementById("in"), msg=inp.value.trim(); if(!msg) return; if(!KEY){ openCfg(); return; }
  document.body.classList.add("chatting");
  inp.value=""; grow(inp); addRow("me",fmt(msg)); const bubble=addRow("ai",thinkHTML(THINK_PHRASES[0],"💭"));
  document.getElementById("send").disabled=true; thinking=true; document.body.classList.add("thinking"); graphStart();
  let answer="", trace=[], pi=0;
  // Rotation "comme Claude" : une phrase apparaît, s'efface, une autre la remplace.
  // Une fois les vraies étapes arrivées, on cycle dessus (recherche web, agenda…).
  const thinkTimer=setInterval(()=>{ if(answer) return;
    if(trace.length){ pi=(pi+1)%trace.length; const s=trace[pi]; bubble.innerHTML=thinkHTML(s.label, s.icon); }
    else { pi=(pi+1)%THINK_PHRASES.length; bubble.innerHTML=thinkHTML(THINK_PHRASES[pi],"💭"); }
    chat.scrollTop=chat.scrollHeight; }, 1700);
  const stopThink=()=>clearInterval(thinkTimer);
  const url=ORIGIN+"/agent/ask/stream?key="+encodeURIComponent(KEY)+"&q="+encodeURIComponent(msg);
  const es=new EventSource(url);
  es.onmessage=(e)=>{ let d; try{ d=JSON.parse(e.data);}catch{ return; }
    if(d.type==="step"){ const ic=iconFor(d.kind,d.tool); graphAdd(ic, d.tool||d.kind);
      trace.push({icon:ic, label:stepLabel(d), detail:(d.q||d.text||"")});
      if(!answer){ bubble.innerHTML=thinkHTML(stepLabel(d), ic); pi=trace.length-1; chat.scrollTop=chat.scrollHeight; } }
    else if(d.type==="answer"){ answer=d.text||""; stopThink(); typewrite(bubble,answer); if(TTS) speak(answer); }
    else if(d.type==="done"){ es.close(); stopThink(); thinking=false; document.body.classList.remove("thinking"); graphEnd(); document.getElementById("send").disabled=false; attachReason(bubble,trace); setTimeout(refreshUsage,900); }
  };
  es.onerror=()=>{ es.close(); stopThink(); thinking=false; document.body.classList.remove("thinking"); graphEnd(); document.getElementById("send").disabled=false;
    if(!answer) bubble.innerHTML="⚠️ Connexion interrompue. Vérifie ta clé (⚙️) et réessaie."; else attachReason(bubble,trace); };
}
function typewrite(el,text){ const html=fmt(text); if(html.includes("<pre>")){ el.innerHTML=html; return; }
  let i=0; clearInterval(el._t); el._t=setInterval(()=>{ el.innerHTML=fmt(text.slice(0,i))+'<span style="opacity:.5">▍</span>'; chat.scrollTop=chat.scrollHeight; i+=2; if(i>=text.length){ clearInterval(el._t); el.innerHTML=html; } },12); }

/* ═══ BARRE DE TOKENS ═══ */
function fmtK(n){ n=+n||0; if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+"M";
  if(n>=1000) return (n/1000).toFixed(n>=1e5?0:1).replace(/\.0$/,'')+"k"; return ""+n; }
async function refreshUsage(){ try{ const r=await fetch(ORIGIN+"/agent/usage",{cache:"no-store"}); const d=await r.json();
  const t=d.total||{used:0,limit:1}, lim=Math.max(1,t.limit), pct=Math.min(100, t.used/lim*100);
  const el=document.getElementById("usage"); document.getElementById("ufill").style.width=pct+"%";
  document.getElementById("utext").innerHTML="<b>"+fmtK(t.used)+"</b> / "+fmtK(t.limit);
  el.classList.toggle("warn", pct>85);
  const cb=d.cerebras||{used:0,limit:0}, gq=d.groq||{used:0,limit:0};
  el.title="Tokens aujourd'hui — Cerebras "+fmtK(cb.used)+"/"+fmtK(cb.limit)+" · Groq "+fmtK(gq.used)+"/"+fmtK(gq.limit);
}catch(e){ document.getElementById("utext").textContent="—"; } }
refreshUsage(); setInterval(refreshUsage, 20000);

/* ═══ VOIX ═══ */
function speak(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/[*#`>]/g,"").slice(0,600)); u.lang="fr-FR"; u.rate=1.05; speechSynthesis.speak(u); }catch(e){} }
let rec=null;
function toggleMic(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ alert("Micro non supporté par ce navigateur (essaie Chrome/Safari)."); return; }
  const btn=document.getElementById("mic");
  if(rec){ rec.stop(); return; }
  rec=new SR(); rec.lang="fr-FR"; rec.interimResults=false; btn.classList.add("rec");
  rec.onresult=(e)=>{ document.getElementById("in").value=e.results[0][0].transcript; };
  rec.onend=()=>{ btn.classList.remove("rec"); rec=null; if(document.getElementById("in").value.trim()) ask(); };
  rec.onerror=()=>{ btn.classList.remove("rec"); rec=null; };
  rec.start();
}
</script>
