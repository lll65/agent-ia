<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVA</title>
<style>
  :root{ --bg:#070710; --glass:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.12);
         --neon:#7c5cff; --neon2:#22d3ee; --txt:#e9e9f5; --dim:#9aa0b5; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ font-family:'Inter',system-ui,-apple-system,sans-serif; color:var(--txt);
        background:var(--bg); overflow:hidden; }
  /* Aurora animée en fond */
  .aurora{ position:fixed; inset:-30%; z-index:0; filter:blur(90px); opacity:.55; }
  .aurora span{ position:absolute; width:46vw; height:46vw; border-radius:50%; mix-blend-mode:screen;
     animation:float 18s ease-in-out infinite; }
  .a1{ background:#7c5cff; top:5%; left:8%; }
  .a2{ background:#22d3ee; bottom:0%; right:6%; animation-delay:-6s; }
  .a3{ background:#ec4899; top:35%; left:45%; animation-delay:-11s; }
  @keyframes float{ 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(6%,-8%) scale(1.15)} 66%{transform:translate(-7%,6%) scale(.9)} }

  .app{ position:relative; z-index:1; height:100dvh; display:flex; flex-direction:column;
        max-width:820px; margin:0 auto; padding:14px; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:6px 4px 12px; }
  .logo{ font-weight:800; font-size:26px; letter-spacing:.32em; background:linear-gradient(90deg,var(--neon),var(--neon2));
         -webkit-background-clip:text; background-clip:text; color:transparent;
         text-shadow:0 0 26px rgba(124,92,255,.45); }
  .logo small{ display:block; letter-spacing:.18em; font-size:10px; color:var(--dim); text-shadow:none; font-weight:600; }
  .gear{ background:var(--glass); border:1px solid var(--stroke); color:var(--txt); width:40px; height:40px;
         border-radius:12px; cursor:pointer; font-size:17px; transition:.2s; }
  .gear:hover{ border-color:var(--neon); box-shadow:0 0 18px rgba(124,92,255,.4); }

  .chat{ flex:1; overflow-y:auto; padding:8px 4px 4px; display:flex; flex-direction:column; gap:14px;
         scrollbar-width:thin; scrollbar-color:var(--neon) transparent; }
  .row{ display:flex; animation:pop .35s cubic-bezier(.2,.9,.3,1.2); }
  .row.me{ justify-content:flex-end; }
  @keyframes pop{ from{opacity:0; transform:translateY(12px) scale(.98)} to{opacity:1; transform:none} }
  .bubble{ max-width:82%; padding:13px 16px; border-radius:18px; line-height:1.5; font-size:15px;
           border:1px solid var(--stroke); backdrop-filter:blur(12px); white-space:pre-wrap; word-wrap:break-word; }
  .me .bubble{ background:linear-gradient(135deg,var(--neon),#5b46d6); border:none; border-radius:18px 18px 5px 18px;
               box-shadow:0 8px 26px rgba(124,92,255,.35); }
  .ai .bubble{ background:var(--glass); border-radius:18px 18px 18px 5px; }
  .bubble pre{ background:#05050c; border:1px solid var(--stroke); border-radius:10px; padding:11px;
               overflow-x:auto; margin:8px 0; font-size:13px; font-family:ui-monospace,monospace; }
  .bubble a{ color:var(--neon2); }
  .avatar{ width:30px; height:30px; border-radius:9px; margin:2px 9px 0 0; flex:0 0 auto;
           background:linear-gradient(135deg,var(--neon),var(--neon2)); display:grid; place-items:center; font-size:15px;
           box-shadow:0 0 16px rgba(34,211,238,.4); }

  .typing{ display:flex; gap:5px; padding:14px 16px; }
  .typing i{ width:8px; height:8px; border-radius:50%; background:var(--neon2); animation:blink 1.2s infinite; }
  .typing i:nth-child(2){ animation-delay:.2s } .typing i:nth-child(3){ animation-delay:.4s }
  @keyframes blink{ 0%,60%,100%{opacity:.25; transform:translateY(0)} 30%{opacity:1; transform:translateY(-4px)} }

  .composer{ display:flex; gap:10px; padding-top:10px; }
  .composer textarea{ flex:1; resize:none; background:var(--glass); border:1px solid var(--stroke); color:var(--txt);
        border-radius:16px; padding:14px 16px; font-size:15px; font-family:inherit; max-height:120px; outline:none; transition:.2s; }
  .composer textarea:focus{ border-color:var(--neon); box-shadow:0 0 22px rgba(124,92,255,.35); }
  .send{ width:56px; border:none; border-radius:16px; cursor:pointer; font-size:20px; color:#fff;
         background:linear-gradient(135deg,var(--neon),var(--neon2)); box-shadow:0 6px 22px rgba(124,92,255,.45); transition:.15s; }
  .send:active{ transform:scale(.92); } .send:disabled{ opacity:.5; cursor:default; }

  .chips{ display:flex; gap:8px; flex-wrap:wrap; padding:2px 0 8px; }
  .chip{ font-size:12.5px; color:var(--dim); background:var(--glass); border:1px solid var(--stroke);
         border-radius:999px; padding:7px 13px; cursor:pointer; transition:.2s; }
  .chip:hover{ color:#fff; border-color:var(--neon); }

  .modal{ position:fixed; inset:0; z-index:5; background:rgba(0,0,0,.6); display:none; place-items:center; padding:20px; }
  .modal.show{ display:grid; }
  .card{ background:#0d0d1a; border:1px solid var(--stroke); border-radius:18px; padding:22px; max-width:420px; width:100%; }
  .card h3{ margin-bottom:6px; } .card p{ color:var(--dim); font-size:13px; margin-bottom:14px; }
  .card input{ width:100%; background:#05050c; border:1px solid var(--stroke); color:var(--txt); border-radius:11px;
               padding:12px; font-size:14px; outline:none; }
  .card button{ width:100%; margin-top:12px; padding:12px; border:none; border-radius:11px; color:#fff; cursor:pointer;
               background:linear-gradient(135deg,var(--neon),var(--neon2)); font-weight:700; }
  .hint{ text-align:center; color:var(--dim); font-size:13px; margin:auto 0; opacity:.8; }
</style>
</head>
<body>
  <div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>

  <div class="app">
    <header>
      <div class="logo">NOVA<small>ASSISTANT · DU FUTUR</small></div>
      <button class="gear" onclick="openCfg()" title="Réglages">⚙️</button>
    </header>

    <div class="chips">
      <span class="chip" onclick="quick(this)">Mon agenda cette semaine ?</span>
      <span class="chip" onclick="quick(this)">Résume l'actu tech du jour</span>
      <span class="chip" onclick="quick(this)">Planifie ma journée</span>
    </div>

    <div class="chat" id="chat">
      <div class="hint" id="hint">✨ Bonjour, je suis Nova. Pose-moi une question.</div>
    </div>

    <div class="composer">
      <textarea id="in" rows="1" placeholder="Parle à Nova…" onkeydown="keydown(event)" oninput="grow(this)"></textarea>
      <button class="send" id="send" onclick="ask()">➤</button>
    </div>
  </div>

  <div class="modal" id="cfg">
    <div class="card">
      <h3>🔑 Connexion à Nova</h3>
      <p>Colle ta clé (la valeur de <b>AGENT_API_KEY</b> définie sur Render). Elle reste sur ton appareil.</p>
      <input id="key" type="password" placeholder="Ta clé API…">
      <button onclick="saveCfg()">Enregistrer</button>
    </div>
  </div>

<script>
const API = location.origin + "/agent/ask";
let KEY = localStorage.getItem("nova_key") || "";
const chat = document.getElementById("chat"), hint = document.getElementById("hint");

if(!KEY) openCfg();
function openCfg(){ document.getElementById("key").value = KEY; document.getElementById("cfg").classList.add("show"); }
function saveCfg(){ KEY = document.getElementById("key").value.trim(); localStorage.setItem("nova_key", KEY);
  document.getElementById("cfg").classList.remove("show"); }

function grow(t){ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,120)+"px"; }
function keydown(e){ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); ask(); } }
function quick(el){ document.getElementById("in").value = el.textContent; ask(); }

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(s){ // markdown minimal
  s = esc(s).replace(/```([\s\S]*?)```/g,(m,c)=>"<pre>"+c.trim()+"</pre>")
            .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
            .replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank">$1</a>')
            .replace(/\n/g,"<br>");
  return s;
}
function addRow(who, html){
  if(hint) hint.remove();
  const row = document.createElement("div"); row.className = "row " + (who==="me"?"me":"ai");
  row.innerHTML = (who==="ai"?'<div class="avatar">🧠</div>':'') + '<div class="bubble">'+html+'</div>';
  chat.appendChild(row); chat.scrollTop = chat.scrollHeight; return row.querySelector(".bubble");
}
function typing(){ return addRow("ai",'<div class="typing"><i></i><i></i><i></i></div>'); }

async function ask(){
  const inp = document.getElementById("in"); const msg = inp.value.trim();
  if(!msg) return;
  if(!KEY){ openCfg(); return; }
  inp.value=""; grow(inp);
  addRow("me", fmt(msg));
  const bubble = typing();
  document.getElementById("send").disabled = true;
  try{
    const r = await fetch(API, { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ message: msg, key: KEY }) });
    if(r.status===401){ bubble.innerHTML="🔒 Clé invalide. Clique ⚙️ pour la corriger."; return; }
    if(r.status===501){ bubble.innerHTML="⚙️ Passerelle désactivée (AGENT_API_KEY manquante sur Render)."; return; }
    const data = await r.json();
    typewrite(bubble, data.answer || "(réponse vide)");
  }catch(e){ bubble.innerHTML = "⚠️ Erreur réseau : "+esc(String(e)); }
  finally{ document.getElementById("send").disabled = false; }
}

// Effet "machine à écrire" (streaming feel)
function typewrite(el, text){
  const html = fmt(text); el.innerHTML = "";
  // si code présent, on affiche direct (le typewriter casserait le HTML)
  if(html.includes("<pre>")){ el.innerHTML = html; chat.scrollTop = chat.scrollHeight; return; }
  let i=0; const plain = text;
  const t = setInterval(()=>{ el.innerHTML = fmt(plain.slice(0,i)) + '<span style="opacity:.5">▍</span>';
    chat.scrollTop = chat.scrollHeight; i += 2;
    if(i >= plain.length){ clearInterval(t); el.innerHTML = html; } }, 12);
}
</script>
</body>
</html>
