version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Ajoute ces lignes si tu as un GPU NVIDIA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  agent-ia:
    build: .
    container_name: agent-ia
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
