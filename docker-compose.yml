version: "3.9"

services:

  # Modèle LLM local (cerveau IA)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
    # GPU NVIDIA: décommente ces lignes si tu as une carte graphique
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Agent IA — API + UI
  agent-ia:
    build: .
    container_name: agent-ia
    ports:
      - "8000:8000"   # API REST
      - "7860:7860"   # Interface Gradio
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID:-0}
      - GRADIO_PORT=7860
    volumes:
      - ./data:/app/data        # mémoire + agents + plugins
      - ./output:/app/output    # vidéos + projets générés
      - ./.env:/app/.env:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ollama_data:
